<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Example</title>

    <style>
        .container { 
            display: flex;
            flex-wrap: wrap;         
            gap: 10px;             
            width: 100%;
            padding: 20px; 
            box-sizing: border-box;
        }

        .A, .B, .C, .D, .E, .F, .G, .H, .I {
            height: 100px;
            width: 100px;
            border: 5px solid black;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            background-color: rgb(206, 91, 110);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class=" A">A</div>
        <div class ="A">B</div>
        <div class=" C">C</div>
        <div class=" D">D</div>
        <div class=" E">E</div>
        <div class=" F">F</div>
        <div class=" G">G</div>
        <div class=" H">H</div>
        <div class=" I">I</div>
    </div>

</body>
</html>
